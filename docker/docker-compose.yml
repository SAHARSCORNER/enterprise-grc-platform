version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: grc_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: grc_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: grc_server
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/grc_db?schema=public"
      JWT_SECRET: "grc_enterprise_super_secret_jwt_key_2026"
    depends_on:
      - postgres

  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
    container_name: grc_client
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  pgdata:
